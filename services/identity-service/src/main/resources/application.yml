server:
  # 8081 is the catalogue. Each service gets its own port locally; behind the
  # gateway on Day 7 they are addressed by name, not by port.
  port: 8082
  
spring:
  application:
    name: identity-service

  output:
    ansi:
      enabled: always #for colored logs in terminal

  # ---------------------------------------------------------------------------
  # Its OWN database. Database-per-service is the boundary this project is built
  # on (`plan.md` §3.1): `identity` owns `users`, and no other service may join
  # against it. Credentials come from the environment, with a local default that
  # only works against the throwaway container on this machine.
  # ---------------------------------------------------------------------------
  datasource:
    url: ${EXR_IDENTITY_DB_URL:jdbc:postgresql://localhost:55432/identity}
    username: ${EXR_IDENTITY_DB_USER:postgres}
    password: ${EXR_IDENTITY_DB_PASSWORD:postgres}
    hikari:
      # Small on purpose. Authentication holds a connection for the length of one
      # password check (~50-100 ms with BCrypt) and nothing longer - and many
      # small pools beat one huge pool, because the database is the limit, not us.
      maximum-pool-size: 5

  jpa:
    # FLYWAY owns the schema. Hibernate only checks that the code matches it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
